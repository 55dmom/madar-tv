name: MadarTV
options:
  bundleIdPrefix: com.madar
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ar
targets:
  MadarTV:
    type: application
    platform: iOS
    sources:
      - path: MadarTV
    info:
      path: MadarTV/Info.plist
      properties:
        CFBundleDisplayName: "مَدار TV"
        CFBundleName: "MadarTV"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBG
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, fetch]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madar.tv
        PRODUCT_NAME: MadarTV
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEBUG_INFORMATION_FORMAT: dwarf
        OTHER_SWIFT_FLAGS: "-Xfrontend -solver-expression-time-threshold=40 -Xfrontend -warn-long-expression-type-checking=400 -Xfrontend -warn-long-function-bodies=800"
        SWIFT_COMPILATION_MODE: wholemodule
    scheme: {}
